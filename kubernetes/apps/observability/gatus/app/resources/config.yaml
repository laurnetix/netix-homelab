---
connectivity:
  checker:
    interval: 1m
    target: 1.1.1.1:53

endpoints:
  - conditions:
      - "[CONNECTED] == true"
    group: connectivity
    interval: 1m
    name: Cloudflare
    url: icmp://1.1.1.1

  - conditions:
      - "[CONNECTED] == true"
    group: connectivity
    interval: 1m
    name: Google
    url: icmp://8.8.8.8

  - conditions:
      - "[CONNECTED] == true"
    group: connectivity
    interval: 1m
    name: Quad9
    url: icmp://9.9.9.9

metrics: true

storage:
  caching: true
  path: /config/gatus.db
  type: sqlite

ui:
  buttons:
    - name: GitHub
      link: https://github.com/laurnetix/netix-homelab
  default-sort-by: group
  header: Status
  title: Status | netix-homelab

web:
  port: 80
