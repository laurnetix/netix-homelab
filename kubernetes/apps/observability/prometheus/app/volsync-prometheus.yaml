---
# Backs up the Prometheus TSDB PVC via VolSync/Kopia to the same NFS
# repository used by other apps (see volsync-kopia-backup-architecture).
# Not using components/volsync directly: that component assumes sourcePVC ==
# ${APP}, but this PVC name is StatefulSet-generated (volumeClaimTemplate),
# not literally "prometheus".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prometheus-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: prometheus
spec:
  # StatefulSet volumeClaimTemplate-generated name, not "prometheus".
  sourcePVC: prometheus-prometheus-kube-prometheus-prometheus-db-prometheus-prometheus-kube-prometheus-prometheus-0
  trigger:
    # Every 6h, not hourly: copyMethod Snapshot means a full Longhorn clone of
    # this volume per run (~15-25 min, 3x-replicated writes), which pushed iowait
    # to ~50% on all nodes. :15 keeps it clear of the :00 hourly app backups and
    # 30 min apart from victoria-logs (:45) so the two large clones never overlap.
    schedule: 15 */6 * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 5Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the Prometheus pod's actual securityContext
      # (runAsUser: 1000, runAsGroup: 2000, fsGroup: 2000) or the mover
      # cannot read the TSDB data through the volume snapshot.
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: prometheus-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    # Class of the temporary clone the mover reads from - single replica, so
    # the clone is written to one node's disk instead of all three (see
    # storage/longhorn/app/storageclass-clone.yaml for why that spares etcd).
    storageClassName: longhorn-clone
    volumeSnapshotClassName: longhorn
