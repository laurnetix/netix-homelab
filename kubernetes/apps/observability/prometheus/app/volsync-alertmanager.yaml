---
# Backs up the Alertmanager PVC (silences, notification log) via VolSync/Kopia.
# Same rationale as volsync-prometheus.yaml re: not using components/volsync
# directly — this PVC name is StatefulSet-generated, not literally "alertmanager".
# Named *-volsync* to avoid colliding with the existing "alertmanager"
# ExternalSecret (Telegram bot token) already in this app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: alertmanager
spec:
  sourcePVC: alertmanager-prometheus-kube-prometheus-alertmanager-db-alertmanager-prometheus-kube-prometheus-alertmanager-0
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the Alertmanager pod's actual securityContext
      # (runAsUser: 1000, runAsGroup: 2000, fsGroup: 2000).
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # SYN-NAS-00 Synology
    parallelism: 2
    repository: alertmanager-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
