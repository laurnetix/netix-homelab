---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus
  interval: 1h
  values:
    # Grafana is deployed as its own app in this namespace; don't run the bundled one.
    grafana:
      enabled: false
    prometheus:
      prometheusSpec:
        # Select all ServiceMonitors/PodMonitors/Probes/PrometheusRules/ScrapeConfigs
        # cluster-wide, regardless of labels (our resources are label-less).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        retention: 10d
        # Hard ceiling on persisted blocks. Without this, retention is time-only:
        # 10d of ~400k active series overran the old 8Gi volume, WAL writes began
        # failing with ENOSPC, and ingestion stopped entirely (dashboards went N/A).
        # Keep this comfortably under the volume size — it does not bound the WAL,
        # and compaction needs free space to write a new block.
        retentionSize: 26GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 32Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
