---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus
  interval: 1h
  values:
    # Grafana is deployed as its own app in this namespace; don't run the bundled one.
    grafana:
      enabled: false
    # KubeHpaMaxedOut is replaced by a zeroscaler-aware copy in
    # prometheusrule.yaml — the upstream guard doesn't exclude minReplicas 0 /
    # maxReplicas 1 HPAs, so it fired permanently for every zeroscaled app.
    defaultRules:
      disabled:
        KubeHpaMaxedOut: true
    # Cilium runs with kube-proxy-replacement=true, so there is no kube-proxy to
    # scrape. Leaving this enabled makes KubeProxyDown — absent(up{job="kube-proxy"})
    # — fire permanently at severity=critical, which can never clear.
    kubeProxy:
      enabled: false
    # The apiserver is the largest series source (~68k of ~344k head series on
    # 2026-10-23), mostly debug-grade histogram buckets that no rule, alert or
    # dashboard here reads (checked against loaded rules, the repo, and every
    # gnetId dashboard). Dropping them shrinks the TSDB - and so the VolSync
    # clone that stalls etcd - by ~20%. Only the _bucket series go; _sum and
    # _count stay for rates and averages.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # Chart default, restated because setting this list replaces it:
          # thins the le buckets of the request/etcd duration histograms that
          # the SLO burn-rate rules DO use.
          - action: drop
            sourceLabels: [__name__, le]
            regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
          - action: drop
            sourceLabels: [__name__]
            regex: 'apiserver_(watch_events_dispatch_duration_seconds|watch_list_duration_seconds|storage_list_duration_seconds|request_body_size_bytes|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds|watch_events_sizes|response_sizes)_bucket'
    # etcd was completely unmonitored until 2026-09-17, which left the most
    # likely cause of apiserver `leases` 500/504s invisible: etcd logs showed
    # "apply request took too long" (423ms vs a 100ms expectation) on
    # /registry/leases reads, with the time spent in "agreement among raft nodes
    # before linearized reading". Those lease timeouts are what make the Longhorn
    # CSI sidecars lose leader election and restart, and what keeps
    # KubeAPIErrorBudgetBurn's 1d/2h and 3d/6h windows lit.
    #
    # No TLS or client certs needed here, unlike most etcd scrape setups: this
    # cluster's Talos config already exposes a plain-HTTP metrics listener via
    # `cluster.etcd.extraArgs.listen-metrics-urls: http://0.0.0.0:2381`
    # (talos/patches/), verified returning HTTP 200 from a pod on all three
    # nodes. NOTE the port is 2381 - Talos v1.14 release notes mention etcd
    # metrics moving to 2383, but that applies to the default listener, not this
    # explicit override. Probe the port before trusting the docs.
    kubeEtcd:
      enabled: true
      # Control-plane node IPs; all three are control-plane here.
      endpoints:
        - 192.168.0.13
        - 192.168.0.251
        - 192.168.0.146
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http
    prometheus:
      prometheusSpec:
        # Select all ServiceMonitors/PodMonitors/Probes/PrometheusRules/ScrapeConfigs
        # cluster-wide, regardless of labels (our resources are label-less).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # 5d, down from 10d (2026-10-23). The TSDB sits at its retention steady
        # state (~11 GiB at 10d, ~1.1 GiB/day of ingest), and every VolSync run
        # full-clones this volume on the single NVMe that etcd shares - a 14 GiB
        # clone stalled etcd for ~15 min per run. Halving retention halves both.
        retention: 5d
        # Hard ceiling on persisted blocks. Without this, retention is time-only:
        # 10d of ~400k active series overran the old 8Gi volume, WAL writes began
        # failing with ENOSPC, and ingestion stopped entirely (dashboards went N/A).
        # Keep this comfortably under the volume size — it does not bound the WAL,
        # and compaction needs free space to write a new block. 12GB is ~2x the
        # expected 5d footprint: room for a cardinality spike, while still
        # bounding how much a backup clone has to copy.
        retentionSize: 12GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 32Gi
    alertmanager:
      alertmanagerSpec:
        # Use our AlertmanagerConfig as the top-level config instead of the
        # chart's default, which routes every alert to a "null" receiver.
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
