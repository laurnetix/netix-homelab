---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus
  interval: 1h
  values:
    # Grafana is deployed as its own app in this namespace; don't run the bundled one.
    grafana:
      enabled: false
    prometheus:
      prometheusSpec:
        # Select all ServiceMonitors/PodMonitors/Probes/PrometheusRules/ScrapeConfigs
        # cluster-wide, regardless of labels (our resources are label-less).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
