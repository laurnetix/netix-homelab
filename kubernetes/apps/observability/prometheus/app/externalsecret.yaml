---
# Pulls the Telegram bot token from the "alertmanager" item in the
# netix-homelab 1Password vault. The chat ID is NOT here — the
# AlertmanagerConfig CRD types chatID as int64 and cannot read it from a
# Secret, so it comes in via Flux postBuild substitution from cluster-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: alertmanager
        property: bot-token
