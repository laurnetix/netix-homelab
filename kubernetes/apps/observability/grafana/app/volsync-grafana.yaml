---
# Backs up the Grafana PVC (created by the Helm chart's persistence.enabled,
# claim name "grafana") via VolSync/Kopia to the same NFS repository the other
# apps use (see volsync-kopia-backup-architecture). Hand-rolled as a standalone
# ReplicationSource rather than via components/volsync: that component's
# restore-on-create PVC path is unused/unproven in this cluster, and every real
# backup here (prometheus, alertmanager, victoria-logs) is a plain source
# against an existing PVC - this matches that proven pattern.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grafana
spec:
  sourcePVC: grafana
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the Grafana pod's actual securityContext (472/472/472) or
      # the mover cannot read grafana.db through the volume snapshot.
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: grafana-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
