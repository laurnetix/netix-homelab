---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chartRef:
    kind: OCIRepository
    name: grafana
  interval: 1h
  values:
    serviceMonitor:
      enabled: true
    # Persist /var/lib/grafana (grafana.db: users, preferences, annotations,
    # and any dashboards created in the UI) instead of the chart's default
    # emptyDir, which reset on every pod restart. Backed up hourly by the
    # ReplicationSource in ./volsync-grafana.yaml.
    persistence:
      enabled: true
      type: pvc
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 2Gi
    # The PVC is RWO on Longhorn; the default RollingUpdate strategy would try
    # to start the new pod (mounting the same volume) before the old one
    # releases it, deadlocking on multi-attach. Recreate tears the old pod down
    # first. Grafana is a singleton, so the brief downtime on upgrade is fine.
    deploymentStrategy:
      type: Recreate
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        prometheus-stats:
          gnetId: 2
          revision: 2
          datasource: Prometheus
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        smartctl-exporter:
          gnetId: 22604
          revision: 3
          # Same object-datasource-form gotcha as volsync below - dashboard
          # 22604 uses "uid": "${DS_PROMETHEUS}" throughout, which the chart's
          # line-based sed can't rewrite via the simple string form.
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus
        # UniFi metrics from observability/unpoller. Both of these use the
        # bare-string "datasource": "${DS_PROMETHEUS}" form, which the chart's
        # line-based sed rewrites fine - so they take the simple string form
        # (the datasource NAME) rather than the list workaround below.
        # Deliberately omitting the other unpoller dashboards: 11314 (UAP) and
        # 11312 (USW) need UniFi access points and UniFi switches, and 23027
        # needs a UniFi PDU. WiFi here is the outer TP-Link and the cluster
        # switch is an unmanaged Netgear, so all three would render empty.
        unifi-client-insights:
          gnetId: 11315
          revision: 9
          datasource: Prometheus
        unifi-network-sites:
          gnetId: 11311
          revision: 5
          datasource: Prometheus
        volsync:
          gnetId: 21356
          revision: 3
          # This dashboard uses the object datasource form ("uid": "${DS_PROMETHEUS}")
          # which the chart's line-based sed can't rewrite. The list form emits a
          # global ${DS_PROMETHEUS} -> <uid> substitution. Value is the datasource
          # UID (see datasources below), not its name.
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus
        # Official CloudNativePG dashboard. Same object-datasource form as
        # volsync above, so it needs the list workaround. This one declares a
        # SECOND input, DS_EXPRESSION, bound to Grafana's built-in expression
        # engine whose UID is the literal "__expr__" - leaving it unsubstituted
        # breaks the panel that uses it.
        # Panels stay empty until the first CNPG Cluster exists (Phase 3,
        # Authelia): cnpg_* metrics come from the database instances, not the
        # operator. Unlike the omitted unpoller dashboards, that data IS coming.
        cloudnative-pg:
          gnetId: 20417
          revision: 4
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus
            - name: DS_EXPRESSION
              value: __expr__

        # Media stack. These three went live with the metrics sidecars added to
        # media/{sonarr,radarr,qbittorrent} - before those, none of these apps
        # exported anything at all.
        #
        # Nothing here for Prowlarr or SABnzbd, and not by oversight:
        #   * grafana.com has no Prowlarr dashboard of any kind. The prowlarr_*
        #     series are there and queryable; they just have no published home,
        #     and a hand-built one belongs in the Grafana UI (it persists to the
        #     PVC) rather than pasted as JSON into this file.
        #   * the two SABnzbd dashboards that exist (12524 and 9567) are written
        #     against msroest/sabnzbd_exporter - sabnzbd_queue_size,
        #     sabnzbd_download_bytes and friends. exportarr names the same ideas
        #     differently (sabnzbd_queue_length, sabnzbd_downloaded_bytes), so
        #     both would render entirely empty. Adding a dashboard that shows
        #     nothing is worse than admitting there isn't one.
        sonarr:
          gnetId: 12530
          revision: 2
          # Bare-string "datasource": "${DS_PROMETHEUS}" form, which the chart's
          # line-based sed rewrites fine - so the simple string form (the
          # datasource NAME), like the unpoller dashboards above.
          datasource: Prometheus
        radarr:
          gnetId: 12896
          revision: 1
          # Also the bare-string form, so the simple form works - note this one
          # names its input DS_RANCHER_MONITORING rather than DS_PROMETHEUS,
          # which is irrelevant here precisely because the string form rewrites
          # the value regardless of the variable's name. It would matter if this
          # ever needed the list workaround.
          #
          # Upstream typo to be aware of: the queue panel queries
          # `radrr_queue_total` (sic) and will always read zero. Everything else
          # is correct.
          datasource: Prometheus
        qbittorrent:
          gnetId: 23784
          revision: 1
          # Object datasource form ("uid": "${DS_PROMETHEUS}") throughout, so
          # this needs the list workaround and the value is the datasource UID.
          # Chosen over the older 15116/23341: it is the one written against
          # martabal/qbittorrent-exporter, which is what the sidecar runs, and
          # it stays within the metrics that exporter emits by default - no
          # qbittorrent_torrent_info, so ENABLE_HIGH_CARDINALITY can stay off.
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus-operated.observability.svc.cluster.local:9090
            access: proxy
            isDefault: true
            jsonData:
              timeInterval: 1m
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames:
    - "grafana.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grafana
          port: 80
