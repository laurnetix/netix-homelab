---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chartRef:
    kind: OCIRepository
    name: grafana
  interval: 1h
  values:
    serviceMonitor:
      enabled: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        prometheus-stats:
          gnetId: 2
          revision: 2
          datasource: Prometheus
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        smartctl-exporter:
          gnetId: 22604
          revision: 3
          # Same object-datasource-form gotcha as volsync below - dashboard
          # 22604 uses "uid": "${DS_PROMETHEUS}" throughout, which the chart's
          # line-based sed can't rewrite via the simple string form.
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus
        volsync:
          gnetId: 21356
          revision: 3
          # This dashboard uses the object datasource form ("uid": "${DS_PROMETHEUS}")
          # which the chart's line-based sed can't rewrite. The list form emits a
          # global ${DS_PROMETHEUS} -> <uid> substitution. Value is the datasource
          # UID (see datasources below), not its name.
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus-operated.observability.svc.cluster.local:9090
            access: proxy
            isDefault: true
            jsonData:
              timeInterval: 1m
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames:
    - "grafana.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grafana
          port: 80
