---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unpoller-secret
    template:
      data:
        # Same 1Password item and field that network/unifi-dns already reads -
        # unpoller's UniFi library sends it as the X-API-Key header, so no
        # separate local UniFi user or password is needed. Reusing one key
        # means a rotation only has to happen in one place.
        UP_UNIFI_DEFAULT_API_KEY: "{{ .UNIFI_API_KEY }}"
  dataFrom:
    - extract:
        key: unifi
