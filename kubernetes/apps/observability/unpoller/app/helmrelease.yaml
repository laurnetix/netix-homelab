---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpoller
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      unpoller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v3.4.1
            env:
              TZ: America/New_York
              # Prometheus-only: unpoller ships an InfluxDB output that is on
              # by default and would log connection errors every interval.
              UP_INFLUXDB_DISABLE: true
              UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:80
              # The UCG-Ultra, same address network/unifi-dns talks to. It is
              # the cluster's default gateway, so this stays reachable without
              # depending on any in-cluster DNS or routing.
              UP_UNIFI_DEFAULT_URL: https://192.168.0.1
              # UniFi OS serves its own self-signed cert on 443. Note there is
              # deliberately no :8443 here - that port is for the legacy
              # standalone controller, not a UCG/UDM.
              UP_UNIFI_DEFAULT_VERIFY_SSL: false
              # Free-form grouping label; surfaces as `source` on the metrics.
              UP_UNIFI_DEFAULT_ROLE: netix
            envFrom:
              - secretRef:
                  name: unpoller-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
