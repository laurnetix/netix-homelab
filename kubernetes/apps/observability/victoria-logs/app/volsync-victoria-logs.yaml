---
# Backs up the VictoriaLogs data PVC via VolSync/Kopia to the same NFS
# repository used by other apps (see volsync-kopia-backup-architecture).
# Not using components/volsync directly: that component assumes sourcePVC ==
# ${APP}, but this PVC name is StatefulSet-generated (volumeClaimTemplate),
# not literally "victoria-logs".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: victoria-logs-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: victoria-logs-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: victoria-logs
spec:
  # StatefulSet volumeClaimTemplate-generated name, not "victoria-logs".
  sourcePVC: server-volume-victoria-logs-0
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 5Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the victoria-logs pod's actual securityContext
      # (runAsUser: 1000, fsGroup: 2000) or the mover cannot read the
      # data through the volume snapshot.
      runAsUser: 1000
      fsGroup: 2000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: victoria-logs-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
