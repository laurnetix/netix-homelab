---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: longhorn
        # ~200GB free per node as of 2026-07; 30Gi x 3 Longhorn replicas = 90GB
        # actual disk usage cluster-wide, comfortable headroom either way.
        size: 30Gi
      # 5d, down from 60d (2026-10-23), matching Prometheus. This volume is
      # full-cloned by VolSync on the NVMe that etcd shares, so a smaller store
      # means a smaller, shorter I/O burst per backup run.
      retentionPeriod: 5d
      route:
        enabled: true
        hostnames:
          - "victoria.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
