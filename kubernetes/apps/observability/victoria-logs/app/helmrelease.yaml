---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: longhorn
        # ~200GB free per node as of 2026-07; 30Gi x 3 Longhorn replicas = 90GB
        # actual disk usage cluster-wide, comfortable headroom either way.
        size: 30Gi
      # 60d is a middle ground between troubleshooting depth and disk usage -
      # tune down if this fills faster than expected once real traffic lands.
      retentionPeriod: 60d
      route:
        enabled: true
        hostnames:
          - "victoria.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
