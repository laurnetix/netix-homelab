---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volsync-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: volsync-perfectra1n
      app.kubernetes.io/instance: volsync
  endpoints:
    # volsync serves metrics over HTTPS (self-signed) on the "https" port with
    # no auth (--metrics-require-rbac=false). The Service name "volsync-metrics"
    # becomes the job label, matching the volsync PrometheusRule and dashboard.
    - port: https
      scheme: https
      path: /metrics
      tlsConfig:
        insecureSkipVerify: true
