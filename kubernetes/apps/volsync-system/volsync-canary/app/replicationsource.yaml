---
# Standalone canary backup. Real apps should instead attach components/volsync
# to their own ks.yaml; this is intentionally self-contained as a health probe.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync-canary
spec:
  sourcePVC: volsync-canary
  trigger:
    schedule: "30 * * * *"
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # SYN-NAS-00 Synology
    repository: volsync-canary-volsync-secret
    retain:
      latest: 40 # floor: always keep the 40 newest snapshots
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
