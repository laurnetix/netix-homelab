---
# Supplementary RBAC to grant envoy-gateway permission to update BackendTLSPolicy
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway-backendtlspolicy-status
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - backendtlspolicies/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-gateway-backendtlspolicy-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envoy-gateway-backendtlspolicy-status
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: network
