state_dir /cache/state
runtime_dir /cache/run

openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

# In-cluster listener only: plaintext on the pod network, never exposed via a
# Gateway. Applications submit unauthenticated to smtp-relay.network.svc so no
# workload ever holds upstream provider credentials.
tls off
hostname {env:HOSTNAME}

smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
    default_source {
        deliver_to &remote_queue
    }
}

# Queue so a transient upstream failure retries instead of dropping mail —
# matters for Authelia password-reset and 2FA-recovery messages.
target.queue remote_queue {
    target &remote_smtp
}

target.smtp remote_smtp {
    starttls yes
    auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
    targets tcp://{env:SMTP_RELAY_SERVER}:{env:SMTP_RELAY_SERVER_PORT}
}
