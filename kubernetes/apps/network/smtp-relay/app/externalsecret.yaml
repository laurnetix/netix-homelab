---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: smtp-relay-secret
    template:
      data:
        # Upstream provider (Resend). SMTP_RELAY_USERNAME is the literal string
        # "resend"; SMTP_RELAY_PASSWORD is a Resend API key. Both live in the
        # "smtp-relay" item of the netix-homelab 1Password vault so the provider
        # can be swapped without touching any application.
        SMTP_RELAY_SERVER: "{{ .SMTP_RELAY_SERVER }}"
        SMTP_RELAY_USERNAME: "{{ .SMTP_RELAY_USERNAME }}"
        SMTP_RELAY_PASSWORD: "{{ .SMTP_RELAY_PASSWORD }}"
  dataFrom:
    - extract:
        key: smtp-relay
