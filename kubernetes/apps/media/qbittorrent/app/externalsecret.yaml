---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
#
# New for the metrics sidecar - qBittorrent is the one app in this namespace
# that had no secret at all, because unlike the *arr apps it has never taken a
# credential from the environment. Its WebUI password is hashed into
# qBittorrent.conf inside the config PVC and is set through the UI.
#
# That is the whole difficulty with monitoring it. Every qBittorrent exporter
# authenticates the same way a browser does, against the WebUI, so it needs a
# real username and password. The two config-file escape hatches do not help:
# Preferences/WebUI/LocalHostAuth defaults to true (localhost is NOT exempt,
# despite what the option name suggests) and AuthSubnetWhitelistEnabled
# defaults to false, and both live in qBittorrent.conf - inside the PVC, not
# declarable here. qBittorrent 5.2 does have a proper WebUI API key, but it is
# generated in the UI too, and the exporter pinned in helmrelease.yaml cannot
# use one yet.
#
# MANUAL PREREQUISITE: create a 1Password item named `qbittorrent` in the vault
# the onepassword-connect ClusterSecretStore reads, with two fields named
# exactly QBITTORRENT_USERNAME and QBITTORRENT_PASSWORD holding the WebUI login
# (Tools > Options > Web UI in qBittorrent). Until that exists this
# ExternalSecret stays unsynced and qbittorrent-secret does not exist - which is
# why the sidecar references it with optional: true. qBittorrent itself keeps
# running; only the exporter fails, loudly, via qBittorrentMetricsScrapeFailing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: qbittorrent-secret
    template:
      data:
        # Names match the exporter's own environment variables, so the sidecar
        # maps them straight through with no rename.
        QBITTORRENT_USERNAME: "{{ .QBITTORRENT_USERNAME }}"
        QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASSWORD }}"
  dataFrom:
    - extract:
        key: qbittorrent
