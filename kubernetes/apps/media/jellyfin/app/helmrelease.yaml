---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  values:
    controllers:
      jellyfin:
        # Recreate, not RollingUpdate: the config volume is RWO, so two pods
        # cannot hold it simultaneously.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Jellyfin exposes Prometheus metrics only when EnableMetrics is true
          # in system.xml, and offers no environment variable for it
          # (jellyfin/jellyfin#6247). system.xml lives on the config PVC and is
          # created on first run, so this flips the flag on every start rather
          # than relying on a one-off manual edit that no one would remember
          # after a restore. Idempotent, and a no-op before first run.
          enable-metrics:
            # Reuses the Jellyfin image so there is no second image for Renovate
            # to track and nothing extra to pull. MUST be bumped together with
            # the app container below - they are the same image in two places
            # and a mismatch pulls two versions on every start.
            image:
              repository: ghcr.io/jellyfin/jellyfin
              # Digest-pinned because v12 dropped three-part tags: 12.0.0 does
              # not exist, and "12"/"12.0"/"12.1" are all MOVING tags (verified
              # 2026-09-17: "12" and "12.0" resolved to different digests, with
              # "12" already tracking 12.1). Without the digest a patch could
              # land silently on any pod restart - unacceptable for an app whose
              # upgrades rewrite the database irreversibly, and it would bypass
              # the Renovate approval gate in .renovaterc.json5.
              tag: 12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
            command:
              - sh
              - -c
              - |
                F=/config/config/system.xml
                if [ -f "$F" ]; then
                  sed -i 's|<EnableMetrics>false</EnableMetrics>|<EnableMetrics>true</EnableMetrics>|' "$F"
                  echo "EnableMetrics: $(grep -o '<EnableMetrics>[a-z]*</EnableMetrics>' "$F")"
                else
                  echo "system.xml not present yet (first run); nothing to do"
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              # Keep in lockstep with the enable-metrics init container above.
              tag: 12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
            env:
              # Advertised to clients for direct connections; without it
              # Jellyfin guesses from the request and can hand out the
              # in-cluster address to remote clients.
              JELLYFIN_PublishedServerUrl: https://jellyfin.${SECRET_DOMAIN}
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &httpPort 8096
                  # A large first-run library scan makes startup slow; be
                  # generous before declaring the container unhealthy.
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
              # Added for the 10.11 -> 12 migration (2026-09-17). v12 rewrites
              # the database on FIRST BOOT and the upgrade docs say that takes
              # "several minutes", but liveness above only tolerates
              # 30s + (6 x 30s) = 3m30s before the kubelet kills the container.
              # Being killed part-way through an irreversible schema rewrite is
              # the worst failure available here, and there is no downgrade.
              # A startup probe suspends liveness/readiness until it passes, so
              # this buys 10 minutes (30 x 20s) for the migration WITHOUT
              # permanently weakening liveness afterwards. Same shape qbittorrent
              # already uses on this chart version for its slow recheck.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Transcoding is CPU-bound here (no iGPU exposed on Talos yet),
                # so memory is the only hard cap.
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: jellyfin
        globalMounts:
          - path: /config
      # Transcode scratch and image caches: regenerable, deliberately not
      # persisted and not backed up. Node disk rather than tmpfs, since a
      # single transcode can be several GB.
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      media:
        type: persistentVolumeClaim
        existingClaim: media-nfs
        globalMounts:
          - path: /data
            # READ-ONLY. Jellyfin only ever reads the library; the *arr stack
            # owns writes. This limits the blast radius of the one media
            # component that is exposed to the internet.
            readOnly: true
    service:
      app:
        ports:
          http:
            port: *httpPort
    serviceMonitor:
      app:
        endpoints:
          # Jellyfin serves metrics on the SAME port as the web UI, which is why
          # the gateway has to block the path externally (see httproutefilter).
          # Prometheus reaches it in-cluster via the Service, bypassing that.
          - port: http
            path: /metrics
            interval: 1m
    route:
      app:
        hostnames: ["jellyfin.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        # Deliberately NO SecurityPolicy / Authelia forward-auth on this route.
        # Per ADR-0001, a gateway auth wall breaks every native client (Android
        # TV, Roku, Swiftfin, mobile) and the API, because they cannot follow
        # the browser redirect. Jellyfin's own auth is the perimeter here,
        # hardened with a server-side 2FA plugin.
        rules:
          # More specific match wins: /metrics is answered with a 404 at the
          # gateway so the unauthenticated endpoint is never publicly reachable.
          - matches:
              - path:
                  type: PathPrefix
                  value: /metrics
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: gateway.envoyproxy.io
                  kind: HTTPRouteFilter
                  name: jellyfin-block-metrics
          - backendRefs:
              - identifier: app
                port: *httpPort
