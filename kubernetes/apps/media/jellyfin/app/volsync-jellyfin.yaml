---
# Backs up the Jellyfin config PVC (settings, users, watch history, and the
# metadata/artwork library) to the same Kopia/NFS repository as everything else.
# Standalone ReplicationSource against an existing PVC, matching the proven
# pattern used by grafana, prometheus, victoria-logs and lldap.
#
# Note the asymmetry with the media itself: the ~1.1 TB library on the NAS is
# deliberately NOT backed up (ADR-0002), but this config volume is - it holds
# watch state and user accounts that no re-download would restore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyfin-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jellyfin
spec:
  sourcePVC: jellyfin
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the Jellyfin pod securityContext or the mover cannot read
      # the config database through the volume snapshot.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: jellyfin-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
