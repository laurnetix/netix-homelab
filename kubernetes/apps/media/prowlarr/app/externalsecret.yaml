---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prowlarr-secret
    template:
      data:
        # Setting the API key explicitly rather than letting Prowlarr generate
        # one on first run: Sonarr and Radarr authenticate to Prowlarr with it,
        # so it needs to be known ahead of time and survive a restore. This is a
        # real credential even though the UI itself has no login.
        PROWLARR__AUTH__APIKEY: "{{ .PROWLARR_API_KEY }}"
  dataFrom:
    - extract:
        key: prowlarr
