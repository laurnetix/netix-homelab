---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-nfs
spec:
  interval: 1h
  path: ./kubernetes/apps/media/media-nfs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  # The PVC must be Bound before any media workload can schedule, so surface a
  # bad export as a failed Kustomization rather than as pods stuck Pending.
  wait: true
