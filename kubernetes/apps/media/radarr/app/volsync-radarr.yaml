---
# Backs up Radarr's config (movie library, profiles, import history) to the
# Kopia/NFS repository. Standalone ReplicationSource against an existing PVC,
# matching grafana / lldap / jellyfin / prowlarr.
#
# Note the asymmetry with the media itself: the library on the NAS is
# deliberately NOT backed up (ADR-0002), but this metadata is - re-downloading
# episodes would not restore quality profiles or which series you follow.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radarr-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: radarr
spec:
  sourcePVC: radarr
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: radarr-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
