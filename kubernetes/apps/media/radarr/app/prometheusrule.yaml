---
# Radarr exposes no Prometheus endpoint; exportarr is the ecosystem answer and
# is worth adding once the whole stack is up. Until then these are built on
# kube-state-metrics and VolSync.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: radarr
spec:
  groups:
    - name: radarr.rules
      rules:
        - alert: RadarrDown
          expr: |-
            kube_deployment_status_replicas_available{namespace="media", deployment="radarr"} == 0
          for: 15m
          annotations:
            summary: >-
              Radarr has had no available replica for 15m - movie downloads and
              imports have stopped
          labels:
            severity: warning

        - alert: RadarrBackupNotRunning
          expr: |-
            increase(volsync_sync_duration_seconds_count{obj_namespace="media", obj_name="radarr", role="source"}[6h]) == 0
          for: 1h
          annotations:
            summary: >-
              Radarr has completed no VolSync backup in 6h - movie library and
              quality profiles are unprotected
          labels:
            severity: warning

        - alert: RadarrConfigVolumeFillingUp
          expr: |-
            (kubelet_volume_stats_used_bytes{namespace="media", persistentvolumeclaim="radarr"}
              / kubelet_volume_stats_capacity_bytes{namespace="media", persistentvolumeclaim="radarr"}) * 100 > 85
          for: 30m
          annotations:
            summary: >-
              Radarr config volume is over 85% full
              ({{ $value | printf "%.1f" }}%)
          labels:
            severity: warning
