---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 1h
  values:
    controllers:
      radarr:
        # Recreate: the config volume is RWO, so two pods cannot hold it at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              # Upstream-stable build (6.3.0.10514 is the newest release NOT
              # flagged prerelease). Unlike Sonarr, home-operations does publish
              # Radarr's stable tags, so we take them.
              tag: 6.4.4.10684
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 7878
              RADARR__UPDATE__BRANCH: master
              TZ: America/New_York
              # No UI login - safe only because the route below is internal-only
              # (ADR-0001). The API key remains a real credential.
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  # First start scans the existing ~1.1 TB library; be generous.
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
          # exportarr: Radarr speaks no Prometheus, so this sidecar polls its
          # REST API and translates the answers into metrics. A sidecar rather
          # than its own Deployment because it then reaches Radarr over the pod
          # loopback - no Service hop, and no second place to keep the API key
          # in sync.
          metrics:
            image:
              repository: ghcr.io/onedr0p/exportarr
              # v2.3.0 is the newest tagged release (Aug 2025). main has since
              # been renamed and is mid-rewrite for a v3 that has not shipped,
              # so do NOT chase `latest` here - the two are far apart and the
              # metric names below are the v2 ones.
              tag: v2.3.0
            # The app to poll is a subcommand, not a flag. One exporter process
            # serves exactly one *arr.
            args: ["radarr"]
            env:
              # 9707 is also the image's built-in default; set explicitly so the
              # Service port and ServiceMonitor below have something to anchor to.
              PORT: &metricsPort 9707
              # Loopback, so this never leaves the pod. Port is *port (7878)
              # above - YAML aliases cannot be interpolated into a string, so it
              # is spelled out; keep the two in step.
              URL: http://localhost:7878
              # NOT the whole radarr-secret via envFrom: exportarr parses EVERY
              # environment variable as config (koanf lowercases names and maps
              # `__` to a path separator), so handing it unrelated keys is asking
              # for a surprise. One key, mapped to the one name it wants.
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: RADARR__AUTH__APIKEY
              TZ: America/New_York
            probes:
              # /healthz answers 200 without touching Radarr, so it reports
              # "exporter process alive", not "Radarr healthy" - which is what a
              # probe should do. Whether Radarr is actually reachable shows up
              # as radarr_system_status / a failed scrape instead.
              liveness: &metricsProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *metricsProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # advancedMounts rather than globalMounts throughout: globalMounts attaches a
    # volume to EVERY container in the controller, which since the exportarr
    # sidecar landed would hand it /config and - worse - the media NFS share it
    # has no business touching. The exporter talks HTTP and nothing else.
    # The `app` entries below are byte-for-byte what globalMounts produced.
    persistence:
      config:
        existingClaim: radarr
        advancedMounts:
          radarr:
            app:
              - path: /config
      logs:
        type: emptyDir
        advancedMounts:
          radarr:
            app:
              - path: /config/logs
      tmp:
        type: emptyDir
        advancedMounts:
          radarr:
            app:
              - path: /tmp
      # CRITICAL: mounted at /data, the SAME path as every other media pod.
      # Downloads and the library must appear on one filesystem at one path or
      # imports silently fall back to copying instead of hardlinking - doubling
      # disk usage and breaking seeding (ADR-0002 Decision 3).
      # Read-write here: Radarr renames and hardlinks into the library.
      media:
        type: persistentVolumeClaim
        existingClaim: media-nfs
        advancedMounts:
          radarr:
            app:
              - path: /data
    service:
      app:
        ports:
          http:
            port: *port
          # Second port on the SAME Service rather than a service of its own -
          # the HTTPRoute below pins its backendRef to *port, so nothing routes
          # user traffic here. It exists for the ServiceMonitor to select.
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        # This chart auto-detects the Service only when exactly one exists,
        # which is the case here - but say it explicitly anyway, because adding
        # a second Service later would turn that into a hard template failure
        # rather than a silent change. qBittorrent is already in that position
        # thanks to its bittorrent LoadBalancer.
        service:
          identifier: app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            # 1m is plenty - none of these numbers move faster than the *arr
            # refresh cycles behind them, and every scrape is real API load on
            # Radarr. The timeout is generous because a scrape walks the whole
            # movie list plus wanted/missing and wanted/cutoff.
            interval: 1m
            scrapeTimeout: 30s
    route:
      app:
        hostnames: ["radarr.${SECRET_DOMAIN}"]
        parentRefs:
          # INTERNAL ONLY - this line is what keeps an unauthenticated admin UI
          # off the public internet.
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
