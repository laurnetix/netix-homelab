---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sabnzbd-secret
    template:
      data:
        # Set explicitly rather than letting the entrypoint generate a random
        # one on first run: Sonarr and Radarr authenticate to SABnzbd with this
        # key, so it has to be known ahead of time and survive a restore.
        # Same reasoning as the Prowlarr/Sonarr/Radarr keys.
        #
        # NOTE: this is the ONLY SABnzbd credential that can be injected. The
        # image's entrypoint only rewrites api_key, nzb_key, host_whitelist and
        # local_ranges in sabnzbd.ini - there is no env var for a news server,
        # so the Frugal Usenet block account is entered in the WebUI and lives
        # in the config PVC (hence the VolSync source alongside this).
        SABNZBD__API_KEY: "{{ .SABNZBD_API_KEY }}"
  dataFrom:
    - extract:
        key: sabnzbd
