---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        # Recreate: the config volume is RWO, and two SABnzbd instances must
        # never share one queue/history database.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3
            env:
              SABNZBD__PORT: &port 8080
              # SABnzbd refuses any request whose Host header it does not
              # recognise, answering "Access denied - Hostname verification
              # failed" with a 403. Bare IPs are exempt, hostnames are not - so
              # every name anything reaches it by has to be listed here or the
              # failure looks like a broken app rather than a config setting.
              #
              # The in-cluster service names matter as much as the external one:
              # Sonarr and Radarr are pointed at sabnzbd.media.svc.cluster.local,
              # and without it here the download client test fails with that
              # same 403 while the WebUI works perfectly through the route.
              #
              # The entrypoint prepends ${HOSTNAME} (the pod name) automatically,
              # so that one does not need listing.
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.media,
                sabnzbd.media.svc,
                sabnzbd.media.svc.cluster.local,
                sabnzbd.${SECRET_DOMAIN}
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # Returns the version without authentication, so it works
                    # regardless of the API key.
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 4
              readiness: *probes
              # A queue with a large history database can take a while to come
              # up; allow up to 5 minutes before declaring failure.
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Deliberately NOT the reference repo's 32Gi. That number
                # assumes a machine far larger than any node here - node-01 is
                # already over 100% on memory limits, and the whole cluster has
                # ~44 GiB allocatable. 4Gi covers the article cache plus a
                # par2 repair and unpack, and matches qBittorrent.
                #
                # NO CPU limit, on purpose: par2 verification/repair and
                # unpacking are bursty and CPU-bound, and throttling them just
                # makes every download slower. The 100m request is what the
                # scheduler sees; the burst is free when nodes are idle.
                memory: 4Gi
          # exportarr: SABnzbd speaks no Prometheus, so this sidecar polls its
          # API and translates the answers into metrics. Same exporter as the
          # *arr apps - it grew a `sabnzbd` subcommand - which is why there is
          # one image and one convention across the whole namespace rather than
          # a different exporter per app.
          metrics:
            image:
              repository: ghcr.io/onedr0p/exportarr
              # v2.3.0 is the newest tagged release (Aug 2025). main has since
              # been renamed and is mid-rewrite for a v3 that has not shipped,
              # so do NOT chase `latest` here - the two are far apart and the
              # metric names below are the v2 ones.
              tag: v2.3.0
            args: ["sabnzbd"]
            env:
              # 9707 is also the image's built-in default; set explicitly so the
              # Service port and ServiceMonitor below have something to anchor to.
              PORT: &metricsPort 9707
              # Loopback, so this never leaves the pod - and deliberately the
              # literal name "localhost", which SABnzbd's hostname verification
              # exempts by name (alongside bare IPv4/IPv6 literals) before it
              # ever consults SABNZBD__HOST_WHITELIST_ENTRIES above. That is why
              # the whitelist needs no new entry for the exporter. Port is *port
              # (8080) above; YAML aliases cannot be interpolated into a string,
              # so it is spelled out - keep the two in step.
              URL: http://localhost:8080
              # NOT the whole sabnzbd-secret via envFrom: exportarr parses EVERY
              # environment variable as config (koanf lowercases names and maps
              # `__` to a path separator), so handing it unrelated keys is asking
              # for a surprise. One key, mapped to the one name it wants.
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: SABNZBD__API_KEY
              TZ: America/New_York
            probes:
              # /healthz answers 200 without touching SABnzbd, so it reports
              # "exporter process alive", not "SABnzbd healthy" - which is what
              # a probe should do. Whether SABnzbd is actually reachable shows
              # up as a failed scrape instead.
              liveness: &metricsProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *metricsProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    # advancedMounts rather than globalMounts throughout: globalMounts attaches a
    # volume to EVERY container in the controller, which since the exportarr
    # sidecar landed would hand it /config and - worse - the media NFS share it
    # has no business touching. The exporter talks HTTP and nothing else.
    # The `app` entries below are byte-for-byte what globalMounts produced.
    persistence:
      config:
        existingClaim: sabnzbd
        advancedMounts:
          sabnzbd:
            app:
              - path: /config
      # Keeps SABnzbd's verbose logging out of the hourly VolSync snapshot.
      # Safe here (unlike qBittorrent, where the log path is nested one level
      # deeper and kubelet ends up creating a root-owned parent directory):
      # /config already exists as the PVC mount, so fsGroup applies cleanly.
      logs:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            app:
              - path: /config/logs
      tmp:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            app:
              - path: /tmp
      # CRITICAL: /data, the SAME path as Sonarr, Radarr and qBittorrent.
      # SABnzbd unpacks into /data/usenet/incomplete and drops finished files in
      # /data/usenet/complete; the *arr apps then import from there into
      # /data/video/*. Because that is all one filesystem the import is an
      # instant rename rather than a byte-for-byte copy across the network.
      # Mount this anywhere else and imports silently become slow copies
      # (ADR-0002 Decision 3).
      #
      # Read-write: SABnzbd writes, repairs, unpacks and deletes here.
      #
      # NOTE ADR-0002 allows moving the unpack scratch to a local SSD PVC to
      # keep par2/unrar random I/O off NFS. Not done: openebs-hostpath is
      # node-local, so it would pin this pod to one node - the exact failure
      # mode ADR-0002 rejected in Option B - and a Frugal block account is
      # bursty enough that NFS is not the bottleneck yet. Revisit if unpack
      # throughput becomes the complaint.
      media:
        type: persistentVolumeClaim
        existingClaim: media-nfs
        advancedMounts:
          sabnzbd:
            app:
              - path: /data
    service:
      app:
        ports:
          http:
            port: *port
          # Second port on the SAME Service rather than a service of its own -
          # the HTTPRoute below pins its backendRef to *port, so nothing routes
          # user traffic here. It exists for the ServiceMonitor to select.
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        # This chart auto-detects the Service only when exactly one exists,
        # which is the case here - but say it explicitly anyway, because adding
        # a second Service later would turn that into a hard template failure
        # rather than a silent change. qBittorrent is already in that position
        # thanks to its bittorrent LoadBalancer.
        service:
          identifier: app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            # Download speed and queue size are the fastest-moving numbers in
            # this namespace, so this is the one exporter where a 1m interval is
            # about resolution rather than politeness.
            interval: 1m
            scrapeTimeout: 30s
    route:
      app:
        hostnames: ["sabnzbd.${SECRET_DOMAIN}"]
        parentRefs:
          # INTERNAL ONLY - this line is what keeps the WebUI, and the news
          # server credentials it displays, off the public internet.
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
