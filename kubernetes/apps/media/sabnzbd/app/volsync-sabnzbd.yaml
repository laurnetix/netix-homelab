---
# Backs up SABnzbd's config (news server credentials, API key, categories, RSS
# feeds and history) to the Kopia/NFS repository. Standalone ReplicationSource
# against an existing PVC, matching qbittorrent / sonarr / radarr / prowlarr.
#
# This one is slightly more valuable than the other media sources: the Frugal
# Usenet block account password is entered in the WebUI and exists nowhere else
# in the cluster - there is no env var for it, so it is not reproducible from
# Git or 1Password the way every other media credential is.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sabnzbd-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: sabnzbd
spec:
  sourcePVC: sabnzbd
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: sabnzbd-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
