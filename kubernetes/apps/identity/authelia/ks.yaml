---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia
spec:
  interval: 1h
  path: ./kubernetes/apps/identity/authelia/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  dependsOn:
    # CNPG CRDs must exist before the Cluster resource below can be applied.
    - name: cloudnative-pg
      namespace: database
    # Authelia binds to LLDAP at startup; without it the pod crash-loops.
    - name: lldap
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: identity
  wait: true
