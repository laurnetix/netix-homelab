---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authelia
spec:
  groups:
    - name: authelia.rules
      rules:
        # Authelia down means no one can sign in to any externally published
        # service. It is the single highest-blast-radius outage in the stack.
        - alert: AutheliaDown
          expr: |-
            kube_deployment_status_replicas_available{namespace="identity", deployment="authelia"} == 0
          for: 10m
          annotations:
            summary: >-
              Authelia has had no available replica for 10m - single sign-on is
              unavailable for all external services
          labels:
            severity: critical

        # Authelia holds no accounts itself, but losing Postgres loses every
        # 2FA enrolment and forces the whole family to re-enrol.
        #
        # Built on CNPG's own exporter, not kube-state-metrics: CNPG manages
        # instance pods directly, with no StatefulSet, so the previous
        # kube_statefulset_status_replicas_ready query matched nothing and this
        # alert could never fire. cnpg_collector_up is 1 per instance whose
        # PostgreSQL is up. max by (pod) collapses the stale series a
        # recreated pod leaves behind under its old IP, and `or on() vector(0)`
        # treats every instance vanishing at once as down rather than silence.
        - alert: AutheliaPostgresDown
          expr: |-
            (sum(max by (pod) (cnpg_collector_up{namespace="identity", cluster="authelia-postgres"})) or on() vector(0)) == 0
          for: 10m
          annotations:
            summary: >-
              Authelia's PostgreSQL cluster has no ready instance for 10m -
              logins and 2FA verification will fail
          labels:
            severity: critical

        # The daily CNPG snapshots are pruned only by the
        # authelia-postgres-snapshot-retention CronJob; CNPG has no retention for
        # volume snapshots. A failed run already raises KubeJobFailed, but a job
        # that silently stops running would raise nothing while snapshots pile
        # up again toward Longhorn's 250-per-volume cap. The `> 0` guard skips
        # the series before the job has ever succeeded.
        - alert: AutheliaPostgresSnapshotPruningStale
          expr: |-
            time() - (kube_cronjob_status_last_successful_time{namespace="identity", cronjob="authelia-postgres-snapshot-retention"} > 0) > 3 * 86400
          for: 1h
          annotations:
            summary: >-
              Authelia's Postgres snapshot pruning has not succeeded in
              {{ $value | humanizeDuration }} - CNPG volume snapshots are
              accumulating again
          labels:
            severity: warning

        # Sustained failed logins on an internet-facing portal. Authelia's own
        # regulation bans the source after 3 tries; this surfaces a broad or
        # persistent attempt that regulation alone would silently absorb.
        - alert: AutheliaHighAuthFailureRate
          expr: |-
            sum(rate(authelia_authn_total{success="false"}[10m])) > 0.5
          for: 15m
          annotations:
            summary: >-
              Authelia is seeing a sustained rate of failed authentications
              ({{ $value | printf "%.2f" }}/s over 10m)
          labels:
            severity: warning
