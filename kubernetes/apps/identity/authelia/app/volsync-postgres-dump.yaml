---
# Ships the nightly pg_dump offsite via the same Kopia/NFS repository as every
# other stateful app. This is the piece that closes the gap described in
# postgres-dump.yaml: CNPG's volume snapshots stay inside the cluster, this
# does not.
#
# Hourly like the others - the dump only changes once a day, so most runs are a
# no-op, but it keeps the schedule uniform and costs almost nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-postgres-dump-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authelia-postgres-dump-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: authelia-postgres-dump
spec:
  sourcePVC: authelia-postgres-dump
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the Authelia Postgres dump pod's securityContext (1000/1000/1000, the UID/GID
      # baked into the rootless image) or the mover cannot read users.db through
      # the volume snapshot.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: authelia-postgres-dump-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
