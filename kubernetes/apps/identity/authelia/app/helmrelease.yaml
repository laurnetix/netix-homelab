---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  chartRef:
    kind: OCIRepository
    name: authelia
  interval: 1h
  values:
    controllers:
      authelia:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.20
            env:
              X_AUTHELIA_CONFIG: /config/configuration.yml
              # Supplied by CNPG rather than 1Password: the operator generates
              # and owns this credential, so there is only one copy of it.
              AUTHELIA_STORAGE_POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: authelia-postgres-app
                    key: password
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &httpPort 9091
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      # REQUIRED. Kubernetes injects service discovery variables for every
      # Service in the namespace, and because this Service is named "authelia"
      # they land as AUTHELIA_SERVICE_HOST, AUTHELIA_PORT,
      # AUTHELIA_POSTGRES_RW_PORT and friends. Authelia parses ANY AUTHELIA_*
      # variable as configuration, so those collide with its config namespace -
      # one of them maps onto the deprecated server.host/port/path keys, which
      # conflict with server.address above and abort startup with
      # "the deprecated keys and the new key can't both be configured".
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/configuration.yml
            subPath: configuration.yml
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *httpPort
          metrics:
            port: &metricsPort 9959
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
    route:
      app:
        # External by design: family members sign in from outside the home
        # network. This is one of only two externally published services.
        hostnames: ["auth.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
