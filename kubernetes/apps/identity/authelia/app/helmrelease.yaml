---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  chartRef:
    kind: OCIRepository
    name: authelia
  interval: 1h
  values:
    controllers:
      authelia:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.22
            env:
              X_AUTHELIA_CONFIG: /config/configuration.yml
              # Enables the Go template filter so configuration.yml can pull the
              # JWKS key and Jellyfin client secret in from mounted files. Without
              # this the {{ secret ... }} directives are treated as literal text
              # and Authelia fails to parse the OIDC section.
              X_AUTHELIA_CONFIG_FILTERS: template
              # Supplied by CNPG rather than 1Password: the operator generates
              # and owns this credential, so there is only one copy of it.
              AUTHELIA_STORAGE_POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: authelia-postgres-app
                    key: password
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &httpPort 9091
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              # Authelia 4.39.20 cannot start with a read-only root filesystem:
              # it aborts with a bare "Errors occurred performing startup checks"
              # and prints no detail at any log level (debug/trace) or format
              # (json/text). Reproduced on six runs; flipping this single field
              # is the only difference between a clean "Startup complete" and
              # the failure.
              #
              # Ruled out while narrowing it down, so nobody repeats the work:
              #   - Postgres: `authelia storage schema-info` succeeds read-only
              #     (schema v24, encryption key valid), so storage is fine.
              #   - The /app/entrypoint.sh permission wrapper: bypassing it with
              #     an explicit command still fails.
              #   - A writable /config (emptyDir): still fails.
              #   - workingDir moved to writable /tmp: still fails.
              #   - Kubernetes service-link env vars: app-template already sets
              #     enableServiceLinks false, so they were never injected.
              # By elimination the failing check is the LDAP/user provider.
              #
              # Compensating controls remain: non-root (1000), no privilege
              # escalation, all capabilities dropped, and the only writable
              # paths are the tmpfs /tmp below and the read-only config mount.
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/configuration.yml
            subPath: configuration.yml
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
      # Read by the config template filter at startup, never as env vars.
      oidc:
        type: secret
        name: authelia-oidc-secret
        globalMounts:
          - path: /secrets
            readOnly: true
    service:
      app:
        ports:
          http:
            port: *httpPort
          metrics:
            port: &metricsPort 9959
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
    route:
      app:
        # External by design: family members sign in from outside the home
        # network. This is one of only two externally published services.
        hostnames: ["auth.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
