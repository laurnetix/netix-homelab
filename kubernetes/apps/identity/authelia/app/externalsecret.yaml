---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authelia-secret
    template:
      data:
        # Every value here is injected as an AUTHELIA_* environment variable,
        # which overrides the corresponding key in configuration.yml. That is
        # what keeps the base DN out of the ConfigMap (and out of this public
        # repo) while the rest of the config stays readable in git.
        AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN: "{{ .LLDAP_LDAP_BASE_DN }}"
        # Composed here so the DN never has to be stored twice. This is the
        # read-only service account in lldap_strict_readonly.
        AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: "uid=authelia,ou=people,{{ .LLDAP_LDAP_BASE_DN }}"
        AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: "{{ .LLDAP_PASS }}"
        # Encrypts secrets at rest in Postgres (TOTP seeds, WebAuthn creds).
        # Losing this makes existing 2FA enrolments undecryptable.
        AUTHELIA_STORAGE_ENCRYPTION_KEY: "{{ .STORAGE_ENCRYPTION_KEY }}"
        # Signs the password-reset / elevated-session JWTs.
        AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "{{ .IDENTITY_VALIDATION_JWT_SECRET }}"
        AUTHELIA_SESSION_SECRET: "{{ .SESSION_SECRET }}"
        # Signs OIDC opaque tokens. Single-line and not inside a list, so unlike
        # the JWKS key and client secret it maps cleanly to an env var.
        AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: "{{ .OIDC_HMAC_SECRET }}"
  dataFrom:
    - extract:
        key: authelia
    # Pulled in only for LLDAP_LDAP_BASE_DN above, so the directory suffix is
    # defined in exactly one place.
    - extract:
        key: lldap
---
# Separate secret because these are consumed as FILES by the config template
# filter, not as environment variables. Keeping them out of authelia-secret
# avoids a multi-line PEM being injected into the process environment by
# envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authelia-oidc-secret
    template:
      data:
        # RSA private key in PKCS#8 PEM. Authelia signs all OIDC ID tokens with
        # this; replacing it invalidates every issued token and forces every
        # client to re-authenticate.
        oidc-jwks.pem: "{{ .OIDC_JWKS_KEY }}"
        # PBKDF2 digest of the Jellyfin client secret.
        jellyfin-client-secret.digest: "{{ .JELLYFIN_CLIENT_SECRET_DIGEST }}"
  dataFrom:
    - extract:
        key: authelia
