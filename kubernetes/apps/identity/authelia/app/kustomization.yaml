---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./cluster.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./postgres-dump.yaml
  - ./prometheusrule.yaml
  - ./volsync-postgres-dump.yaml
configMapGenerator:
  - name: authelia-configmap
    files:
      - ./resources/configuration.yml
generatorOptions:
  disableNameSuffixHash: true
