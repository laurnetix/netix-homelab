---
# Authelia's PostgreSQL, per ADR-0001 (one database per application).
#
# This database holds 2FA enrollments, user preferences and OAuth consent - NOT
# the accounts themselves, which live in LLDAP. That distinction sets the
# backup bar: losing this costs the family a TOTP re-enrolment, whereas losing
# LLDAP would lose the accounts outright. LLDAP is therefore the volume that
# ships offsite to Kopia; this one uses in-cluster volume snapshots.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-postgres
spec:
  # Two instances so the operator can actually fail over - the reason CNPG was
  # chosen over a bare Postgres Deployment in the first place.
  instances: 2
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: authelia
      owner: authelia
  backup:
    volumeSnapshot:
      # Same VolumeSnapshotClass the VolSync movers already use.
      className: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    # Deliberately false: spec.monitoring.enablePodMonitor is deprecated and
    # slated for removal, so the PodMonitor below is managed explicitly instead.
    enablePodMonitor: false
---
# Exports the cnpg_* series that the (currently dormant) cluster alerts in
# database/cloudnative-pg/app/prometheusrule.yaml are waiting for.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authelia-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authelia-postgres
spec:
  # CNPG uses six-field cron (leading seconds field): 03:30 daily.
  schedule: "0 30 3 * * *"
  cluster:
    name: authelia-postgres
  backupOwnerReference: self
  method: volumeSnapshot
