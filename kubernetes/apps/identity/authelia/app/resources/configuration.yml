---
# Non-sensitive Authelia configuration. Anything secret - or anything containing
# the LDAP base DN - is supplied instead as an AUTHELIA_* environment variable
# from authelia-secret, which takes precedence over the values here.

theme: 'auto'

server:
  address: 'tcp://:9091'

log:
  level: 'info'
  format: 'json'

telemetry:
  metrics:
    enabled: true
    address: 'tcp://:9959/metrics'

totp:
  issuer: '${SECRET_DOMAIN}'
  algorithm: 'sha1'
  digits: 6
  period: 30

authentication_backend:
  # How often group membership changes in LLDAP are picked up.
  refresh_interval: '5 minutes'
  password_reset:
    # REQUIRED to be disabled: the bind account is in lldap_strict_readonly and
    # therefore cannot write a new password back to the directory. Password
    # resets are handled by LLDAP's own self-service flow, which sends mail
    # through the same relay. Enabling this would surface a reset form that
    # always fails.
    disable: true
  ldap:
    # Built-in preset: fills in users_filter, groups_filter and the whole
    # attribute mapping for LLDAP, so only the connection details are needed.
    implementation: 'lldap'
    address: 'ldap://lldap.identity.svc.cluster.local:3890'
    # base_dn / user / password arrive via AUTHELIA_* env vars.

access_control:
  # Deny by default; every protected app opts in explicitly. Nothing uses
  # forward-auth yet - Jellyfin deliberately must not (ADR-0001), so the first
  # real rules arrive with the first browser-only external app.
  default_policy: 'deny'
  rules:
    # The portal itself must never require auth, or login is unreachable.
    - domain: 'auth.${SECRET_DOMAIN}'
      policy: 'bypass'

session:
  cookies:
    - domain: '${SECRET_DOMAIN}'
      authelia_url: 'https://auth.${SECRET_DOMAIN}'
      name: 'authelia_session'
      expiration: '1 hour'
      inactivity: '15 minutes'
      remember_me: '1 month'

regulation:
  # Brute-force protection on the externally reachable portal.
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '10 minutes'

storage:
  postgres:
    # CNPG publishes a -rw service that always points at the current primary,
    # so failover needs no config change here.
    address: 'tcp://authelia-postgres-rw.identity.svc.cluster.local:5432'
    database: 'authelia'
    username: 'authelia'
    # password arrives via AUTHELIA_STORAGE_POSTGRES_PASSWORD from the
    # CNPG-generated authelia-postgres-app secret.

notifier:
  # The startup check emails startup_check_address (default: test@authelia.com)
  # on EVERY start. With Renovate restarting this pod regularly that would be a
  # stream of real messages through Resend to a third party, so it is off.
  # Relay-side failures are already covered by the SMTPRelayQueueBacklog alert.
  disable_startup_check: true
  smtp:
    address: 'smtp://smtp-relay.network.svc.cluster.local:25'
    sender: 'Authelia <noreply@send.${SECRET_DOMAIN}>'
    subject: '[Authelia] {title}'
    # The in-cluster hop to maddy is plaintext by design; the relay applies
    # STARTTLS on the onward leg to Resend.
    disable_require_tls: true

# OpenID Connect provider. Per ADR-0001 this is Mode B - Authelia acts as the
# identity provider and each application runs its own session - rather than a
# forward-auth wall, which native Jellyfin clients cannot use.
#
# The two secret values below are injected by Authelia's Go template filter
# (X_AUTHELIA_CONFIG_FILTERS=template) reading files mounted from
# authelia-oidc-secret. They are NOT environment variables: the JWKS key is a
# multi-line PEM, and the client secret lives inside a list element, neither of
# which maps cleanly onto Authelia's env-var scheme. This keeps both out of the
# ConfigMap, and therefore out of this public repository.
identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/secrets/oidc-jwks.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'jellyfin'
        client_name: 'Jellyfin'
        # PBKDF2 digest, not the plaintext. Jellyfin's SSO plugin holds the
        # plaintext counterpart.
        client_secret: {{ secret "/secrets/jellyfin-client-secret.digest" | msquote }}
        public: false
        # Forces a second factor for Jellyfin web sign-in. This is what makes
        # TOTP enrolment appear in the Authelia portal (ADR-0001 item 11) - with
        # no client demanding two_factor there was nothing to enrol for.
        authorization_policy: 'two_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          # Path is fixed by jellyfin-plugin-sso: /sso/OID/redirect/<provider>,
          # where the provider is named "authelia" in the plugin config.
          - 'https://jellyfin.${SECRET_DOMAIN}/sso/OID/redirect/authelia'
        scopes:
          - 'openid'
          - 'profile'
          # Carries LLDAP group membership so the plugin can map admins/members
          # onto Jellyfin roles. Groups stay defined in LLDAP only (ADR-0001).
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        # MUST be client_secret_basic, despite Authelia's own Jellyfin
        # integration guide specifying client_secret_post. jellyfin-plugin-sso
        # uses Duende.IdentityModel.OidcClient, which authenticates with HTTP
        # Basic. With 'post' the plugin fails at the Pushed Authorization
        # Request step - Jellyfin logs "Failed to push authorization parameters"
        # and returns HTTP 400, while Authelia rejects it with
        # "the OAuth 2.0 client registration does not allow this method".
        token_endpoint_auth_method: 'client_secret_basic'
