---
# Backs up the LLDAP SQLite directory to the same Kopia/NFS repository as every
# other app (see volsync-kopia-backup-architecture). Hand-rolled as a standalone
# ReplicationSource against an existing PVC rather than via components/volsync,
# matching the proven pattern used by grafana, prometheus and victoria-logs.
#
# This is the most important backup in the cluster: it is the ONLY copy of the
# family account directory, and per ADR-0001 it is the durable layer the whole
# identity stack is designed around. Restoring it restores every account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lldap-volsync-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
  dataFrom:
    - extract:
        key: volsync-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: lldap
spec:
  sourcePVC: lldap
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes: [ReadWriteOnce]
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      # Must match the LLDAP pod's securityContext (1000/1000/1000, the UID/GID
      # baked into the rootless image) or the mover cannot read users.db through
      # the volume snapshot.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # Synology NAS
    parallelism: 2
    repository: lldap-volsync-secret
    retain:
      latest: 40
      hourly: 24
      daily: 7
      weekly: 4
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
