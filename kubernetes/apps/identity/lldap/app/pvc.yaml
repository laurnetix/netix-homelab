---
# Declared explicitly rather than generated by app-template so the claim name is
# stable and predictable for the VolSync ReplicationSource in volsync-lldap.yaml.
# The directory itself is tiny (a handful of family accounts in SQLite); 1Gi is
# generous and leaves room for the config file and derived private key.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
