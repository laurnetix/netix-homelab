---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lldap-secret
    template:
      data:
        # LLDAP_KEY_SEED derives the server private key used to store user
        # passwords. It is the single most important value in the identity
        # stack: lose or change it and every stored password becomes
        # unrecoverable. It must never be rotated casually.
        LLDAP_KEY_SEED: "{{ .LLDAP_KEY_SEED }}"
        # Signs session JWTs. Changing it logs everyone out but is otherwise
        # recoverable.
        LLDAP_JWT_SECRET: "{{ .LLDAP_JWT_SECRET }}"
        # Directory admin (ldap_user_dn defaults to "admin"). Minimum 8 chars.
        LLDAP_LDAP_USER_PASS: "{{ .LLDAP_LDAP_USER_PASS }}"
        # Kept out of git alongside SECRET_DOMAIN: this repository is public.
        # Effectively permanent - changing the base DN means rebuilding the
        # directory and reconfiguring every downstream OIDC/LDAP client.
        LLDAP_LDAP_BASE_DN: "{{ .LLDAP_LDAP_BASE_DN }}"
  dataFrom:
    - extract:
        key: lldap
