---
# Talos upgrades cannot skip minor versions - only adjacent-minor migrations
# are tested (docs.siderolabs.com/talos/v1.13/.../upgrading-talos). Ladder:
# v1.11.3 -> v1.12.10 -> v1.13.6. Rung 1 (v1.12.10) completed successfully on
# all 3 nodes 2026-07-20 in ~20 minutes total, fully sequential, zero failures.
# This bumps to rung 2 (v1.13.6), the final target. tuppr does NOT enforce the
# ladder itself - it upgrades directly to whatever version is set here.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    version: v1.13.6
  # All 3 nodes are control-plane (no dedicated workers), so no nodeSelector -
  # every node is in scope. Talos itself additionally enforces one-CP-node-at-
  # a-time via etcd quorum checks, independent of tuppr.
  policy:
    force: false # never skip etcd health checks
    # No `drain:` block here - spec.policy.drain doesn't exist in the real CRD
    # (confirmed against the live schema after tuppr installed; `spec.drain` is
    # a separate, deprecated top-level field). Drain is enabled by default;
    # `policy.nodrain: true` is what would turn it off, which we don't want.
    # Wait for CSI volumes to fully detach before rebooting - the Longhorn
    # engine for any volume with a replica on this node runs in this node's
    # kernel, so a clean detach avoids an unclean engine shutdown.
    waitForVolumeDetach: true
    timeout: 30m # bounds cordon+drain+reboot+rejoin for a single node
  parallelism: 1 # strictly sequential: with defaultReplicaCount 3 across
  # exactly 3 nodes, every volume already has a replica on every node. Taking
  # a second node down before the first's replicas fully resync would leave
  # only 1 copy of the data.
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      # Only require "healthy" while attached. Detached volumes report
      # robustness "unknown" regardless of cause (e.g. volsync-canary is
      # intentionally zeroscaled to 0 when idle) - gating on attachment state
      # avoids hardcoding an exclusion for the canary specifically, but note
      # this also means an unexpectedly-detached volume wouldn't block the
      # gate. This check exists to make sure a rebooted node's replicas have
      # finished resyncing before the next node goes down, not to be the only
      # signal of a genuinely broken volume - Alertmanager/Telegram covers that.
      expr: status.state != "attached" || status.robustness == "healthy"
      # Started as an untested assumption for how long a 32Gi replica takes to
      # resync; rung 1 showed actual resyncs complete in under 2 minutes, so
      # this 30m ceiling is comfortable headroom, not a value being pushed
      # close to its limit. Leaving it as-is.
      timeout: 30m
