---
# Kubernetes ladder: v1.34.1 -> v1.35.6 -> v1.36.2. Rung 1 (v1.35.6) completed
# successfully 2026-07-20 in ~7 minutes via a single Job running
# `talosctl upgrade-k8s` - confirmed live (not just from docs) that this CRD
# does no kubectl cordon/drain at all, unlike TalosUpgrade: Alertmanager and
# Prometheus never restarted or moved during the whole rung. This bumps to
# rung 2 (v1.36.2), the final target.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    version: v1.36.2
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      expr: status.state != "attached" || status.robustness == "healthy"
      timeout: 30m
