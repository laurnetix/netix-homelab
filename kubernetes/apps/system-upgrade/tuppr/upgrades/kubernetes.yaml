---
# Kubernetes upgrades follow the same one-minor-at-a-time rule as Talos. The
# Talos ladder (v1.11.3 -> v1.12.10 -> v1.13.6) completed successfully
# 2026-07-20, so this can now proceed. Ladder: v1.34.1 -> v1.35.6 -> v1.36.2.
# This CR targets rung 1 only; bump to v1.36.2 in a follow-up edit once rung 1
# is confirmed healthy, same pattern as talos.yaml.
#
# Unlike TalosUpgrade, this CRD has no policy/parallelism/nodeSelector/drain
# fields - it appears to upgrade cluster-wide via a single Job rather than
# per-node batches. Its shared status.phase enum still lists "Draining" and
# "Rebooting" though, so this assumption is unconfirmed until watched live.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    version: v1.35.6 # rung 1 of 2; v1.36.2 follows once this is healthy
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      expr: status.state != "attached" || status.robustness == "healthy"
      timeout: 30m
