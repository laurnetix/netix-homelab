---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashboard
spec:
  chartRef:
    kind: OCIRepository
    name: kubernetes-dashboard
  interval: 1h
  values:
    kong:
        proxy:
          tls:
            enabled: true
            servicePort: 8443
            containerPort: 8443
        secretVolumes:
          - kong-custom-cert
        env:
          ssl_cert: /etc/secrets/kong-custom-cert/tls.crt
          ssl_cert_key: /etc/secrets/kong-custom-cert/tls.key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
spec:
  hostnames:
    - "dashboard.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: dashboard-kong-proxy
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: dashboard
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: dashboard-kong-proxy
  validation:
    hostname: dashboard-kong-proxy.default.svc.cluster.local
    caCertificateRefs:
      - name: kong-cert
        group: ""
        kind: Secret
