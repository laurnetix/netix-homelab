---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}
spec:
  sourcePVC: ${APP}
  trigger:
    schedule: 0 * * * *
  kopia:
    accessModes:
      - ${VOLSYNC_ACCESSMODES:=ReadWriteOnce}
    cacheAccessModes:
      - ${VOLSYNC_CACHE_ACCESSMODES:=ReadWriteOnce}
    cacheCapacity: ${VOLSYNC_CAPACITY:=5Gi}
    cacheStorageClassName: ${VOLSYNC_CACHE_STORAGECLASS:=openebs-hostpath}
    compression: zstd-fastest
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: ${VOLSYNC_PUID:=1000}
      runAsGroup: ${VOLSYNC_PGID:=1000}
      fsGroup: ${VOLSYNC_PGID:=1000}
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /volume1/kopia
            server: 192.168.0.31 # SYN-NAS-00 Synology
    parallelism: 2
    repository: ${APP}-volsync-secret
    retain:
      latest: ${VOLSYNC_RETAIN_LATEST:=40} # floor: always keep the N newest snapshots
      hourly: ${VOLSYNC_RETAIN_HOURLY:=24}
      daily: ${VOLSYNC_RETAIN_DAILY:=7}
      weekly: ${VOLSYNC_RETAIN_WEEKLY:=4}
    storageClassName: ${VOLSYNC_STORAGECLASS:=longhorn}
    volumeSnapshotClassName: ${VOLSYNC_SNAPSHOTCLASS:=longhorn}
